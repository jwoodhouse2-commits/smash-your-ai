<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password - Smash Your AI</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] } } }
    }
  </script>
  <style>
    * { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .gradient-btn { background: linear-gradient(135deg, #8b5cf6, #6366f1); }
    .gradient-btn:hover { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <a href="/">
        <img src="/images/logo.png" alt="Smash Your AI" class="h-8 mx-auto mb-6">
      </a>
      <h1 class="text-2xl font-extrabold text-gray-900 mb-1">Choose a new password</h1>
      <p class="text-sm text-gray-500">Must be at least 6 characters.</p>
    </div>

    <!-- Reset form -->
    <form id="reset-form" class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">New password</label>
        <input type="password" name="password" required minlength="6" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-violet-300 focus:ring-2 focus:ring-violet-100">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm password</label>
        <input type="password" name="confirm" required minlength="6" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-violet-300 focus:ring-2 focus:ring-violet-100">
      </div>
      <div id="reset-error" class="text-sm text-red-600 hidden"></div>
      <div id="reset-success" class="text-sm text-green-600 hidden"></div>
      <button type="submit" id="reset-btn" class="w-full gradient-btn text-white font-semibold py-2.5 rounded-xl text-sm transition-all">
        Reset password
      </button>
    </form>

    <!-- Invalid/expired token message -->
    <div id="invalid-token" class="hidden bg-white rounded-2xl shadow-sm border border-gray-200 p-8 text-center">
      <div class="w-14 h-14 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </div>
      <h2 class="text-lg font-bold text-gray-900 mb-2">Link expired or invalid</h2>
      <p class="text-sm text-gray-500 mb-4">This reset link is no longer valid. Please request a new one.</p>
      <a href="/prompts?login=1" class="text-sm text-violet-600 font-semibold hover:text-violet-800">Back to login</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      document.getElementById('reset-form').classList.add('hidden');
      document.getElementById('invalid-token').classList.remove('hidden');
    }

    // Validate token on load
    (async () => {
      if (!token) return;
      try {
        const res = await fetch(`/prompts/auth/validate-reset-token?token=${token}`);
        if (!res.ok) {
          document.getElementById('reset-form').classList.add('hidden');
          document.getElementById('invalid-token').classList.remove('hidden');
        }
      } catch (e) {
        // Let form show — server will validate on submit
      }
    })();

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const password = form.password.value;
      const confirm = form.confirm.value;
      const errorEl = document.getElementById('reset-error');
      const successEl = document.getElementById('reset-success');

      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');

      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch('/prompts/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error;
          errorEl.classList.remove('hidden');
          return;
        }

        form.classList.add('hidden');
        successEl.textContent = 'Password reset successfully.';
        successEl.classList.remove('hidden');
        // Show success state outside form
        form.parentElement.innerHTML = `
          <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 text-center">
            <div class="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="w-7 h-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
            <h2 class="text-lg font-bold text-gray-900 mb-2">Password updated</h2>
            <p class="text-sm text-gray-500 mb-4">You can now log in with your new password.</p>
            <a href="/prompts?login=1" class="inline-block gradient-btn text-white font-semibold py-2.5 px-8 rounded-xl text-sm">Log in</a>
          </div>
        `;
      } catch (err) {
        errorEl.textContent = 'Something went wrong. Please try again.';
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
